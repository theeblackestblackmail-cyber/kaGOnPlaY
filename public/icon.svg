<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181820" />
      <stop offset="70%" stop-color="#0c0c0e" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3e3e" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="#050508" />
  
  <!-- Outer Vinyl Edge -->
  <circle cx="256" cy="256" r="216" fill="url(#disc)" stroke="#22222a" stroke-width="4" />
  
  <!-- Vinyl Grooves -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2a2a38" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="165" fill="none" stroke="#222230" stroke-width="1" opacity="0.7" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#2a2a38" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.5" />
  <circle cx="256" cy="256" r="115" fill="none" stroke="#1f1f28" stroke-width="1" opacity="0.8" />
  
  <!-- Center Crimson Core -->
  <circle cx="256" cy="256" r="85" fill="#0e0e12" stroke="url(#neonGrad)" stroke-width="6" filter="url(#glow)" />
  <circle cx="256" cy="256" r="72" fill="#ff3e3e" opacity="0.15" />

  <!-- Play Symbol / Waveform Hardware Motif -->
  <path d="M 235 210 L 295 256 L 235 302 Z" fill="url(#neonGrad)" filter="url(#glow)" />
  
  <!-- Equalizer Bars on lower perimeter -->
  <rect x="180" y="380" width="8" height="24" rx="4" fill="#ff3e3e" />
  <rect x="198" y="365" width="8" height="39" rx="4" fill="#ff3e3e" />
  <rect x="216" y="350" width="8" height="54" rx="4" fill="#f43f5e" />
  <rect x="234" y="360" width="8" height="44" rx="4" fill="#ff3e3e" />
  <rect x="252" y="340" width="8" height="64" rx="4" fill="#ff3e3e" filter="url(#glow)" />
  <rect x="270" y="355" width="8" height="49" rx="4" fill="#f43f5e" />
  <rect x="288" y="368" width="8" height="36" rx="4" fill="#ff3e3e" />
  <rect x="306" y="375" width="8" height="29" rx="4" fill="#ff3e3e" />
  <rect x="324" y="385" width="8" height="19" rx="4" fill="#f43f5e" />

  <!-- Center Spindle -->
  <circle cx="256" cy="256" r="12" fill="#000000" stroke="#f2efeb" stroke-width="2" />
</svg>
