    <script>
      (function () {
        function isExternalOrBenignError(msg, stack, filename) {
          var text = (msg || '') + ' ' + (stack || '') + ' ' + (filename || '');
          return (
            text.indexOf('chrome-extension://') !== -1 ||
            text.indexOf('moz-extension://') !== -1 ||
            text.indexOf('chrome: call method') !== -1 ||
            text.indexOf('WebSocket') !== -1
          );
        }

        window.addEventListener(
          'error',
          function (event) {
            var stack = event.error && event.error.stack ? event.error.stack : '';
            if (isExternalOrBenignError(event.message, stack, event.filename)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event.reason;
            var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
            var stack = reason && reason.stack ? reason.stack : '';
            if (isExternalOrBenignError(msg, stack, '')) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
