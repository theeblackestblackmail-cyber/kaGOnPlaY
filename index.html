  <body class="bg-[#000000] text-[#f2efeb] antialiased select-none overflow-x-hidden">
    <script>
      // Ignore benign HMR WebSocket errors per AI Studio environment constraints
      window.addEventListener('error', function (event) {
        if (event.message && event.message.includes('WebSocket')) {
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && (String(event.reason).includes('WebSocket') || (event.reason.message && event.reason.message.includes('WebSocket')))) {
          event.preventDefault();
        }
      });
    </script>
